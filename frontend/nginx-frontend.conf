# LeanLens v2 frontend — internal static server (behind the main nginx proxy).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: TanStack Router history routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed assets are immutable
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        try_files $uri =404;
    }
}
