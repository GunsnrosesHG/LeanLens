# LeanLens PFE — reverse proxy (frontend + API Django + médias + onvif).
#
# Rebrand : les images amont contiennent encore l'ancienne marque dans le
# HTML/JS/CSS servi. sub_filter la réécrit à la volée en « LeanLens » —
# aucun rebuild d'image nécessaire. Les chaînes ci-dessous sont les motifs
# RECHERCHÉS (la marque amont) : fonctionnels, invisibles côté utilisateur. Le mode sub_filter
# (tout sauf off) désactive la compression amont, condition requise pour
# que la réécriture fonctionne.
server {
    listen 80;
    server_tokens off;

    # ---- Marque affichée : LeanLens partout, 5s nulle part ----
    sub_filter '5S Control' 'LeanLens';
    sub_filter '5sControl' 'LeanLens';
    sub_filter '5scontrol' 'leanlens';
    sub_filter '5SControl' 'LeanLens';
    sub_filter '5s control' 'LeanLens';
    sub_filter_once off;
    sub_filter_types text/html text/javascript application/javascript application/json text/css;
    proxy_set_header Accept-Encoding "";

    location /admin {
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_pass   http://django:8000/admin;
    }

    # LeanLens v2 UI (shadcn-admin rebuild, static bundle).
    # Fallback = ancienne UI CRA : proxy_pass http://front:3000;
    location / {
        proxy_pass   http://front-v2:8080;
    }

    location /images/ {
        alias /usr/src/app/images/;
    }

    location /videos/ {
        alias /usr/src/app/videos/;
    }

    location /api/onvif/ {
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_pass   http://onvif:3456/;
    }

    # Le controller redémarre parfois (crash-loop amont) : résolution à la
    # requête (variable + resolver Docker) au lieu du démarrage nginx.
    location /api/algorithms/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $algorithms_controller algorithms-controller;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_pass   http://$algorithms_controller:3333/;
    }

    location /socket/onvif/ {
        proxy_pass http://onvif:3456/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api {
        try_files $uri @proxy_backend;
    }

    location @proxy_client {
        # Fallback ancienne UI : proxy_pass http://front:3000;
        proxy_pass   http://front-v2:8080;
    }

    location @proxy_backend {
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_pass   http://django:8000;
    }
}
